<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Мой вес</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
:root{--bg:#fff;--fg:#000;--mute:#6b6b6b;--line:#e4e4e4;--slab:#000;--slab-fg:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#000;--fg:#fff;--mute:#9a9a9a;--line:#222;--slab:#fff;--slab-fg:#000}}
body{font-family:"Onest",system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--fg);min-height:100vh;padding:max(16px,env(safe-area-inset-top)) 16px max(40px,env(safe-area-inset-bottom))}
main{max-width:760px;margin:0 auto}
header{display:flex;justify-content:space-between;align-items:center;padding:8px 4px 20px;font-weight:600;font-size:18px}
.live{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--mute);font-weight:400}
.live i{width:8px;height:8px;border-radius:50%;background:var(--fg);animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.2}}
.slab{background:var(--slab);color:var(--slab-fg);border-radius:32px;padding:28px 24px 14px;overflow:hidden}
.when{opacity:.6;font-size:15px}
.num{font-size:clamp(96px,28vw,180px);font-weight:800;letter-spacing:-.055em;line-height:.95;margin:10px 0 14px;font-variant-numeric:tabular-nums}
.num small{font-size:.2em;font-weight:500;letter-spacing:0;margin-left:.2em;opacity:.55}
.delta{display:inline-block;border:1px solid currentColor;border-radius:99px;padding:6px 14px;font-size:14px}
#chart svg{display:block;margin-top:22px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);margin:28px 0 8px}
.stats div{padding:0 4px 0 16px;border-left:1px solid var(--line)}
.stats div:first-child{border-left:0;padding-left:4px}
.stats b{display:block;font-size:clamp(24px,7vw,36px);font-weight:600;letter-spacing:-.03em}
.stats span{font-size:14px;color:var(--mute)}
h2{font-size:18px;font-weight:600;margin:32px 4px 8px}
.row{display:flex;align-items:baseline;gap:12px;padding:15px 4px;border-top:1px solid var(--line)}
.row .d{flex:1;color:var(--mute);font-size:15px}
.row .c{color:var(--mute);font-size:14px;min-width:56px;text-align:right}
.row .w{font-weight:600;font-size:20px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.empty{padding:20px 4px;color:var(--mute)}
@media (prefers-reduced-motion:reduce){.live i{animation:none}}
</style>
</head>
<body>
<main>
  <header>
    <span>Мой вес</span>
    <span class="live"><i></i>обновляется сам</span>
  </header>

  <section class="slab">
    <div class="when" id="when">Загрузка…</div>
    <div class="num"><span id="val">—</span><small>кг</small></div>
    <span class="delta" id="delta" hidden></span>
    <div id="chart"></div>
  </section>

  <section class="stats">
    <div><b id="min">—</b><span>минимум</span></div>
    <div><b id="avg">—</b><span>среднее</span></div>
    <div><b id="max">—</b><span>максимум</span></div>
  </section>

  <h2>Последние записи</h2>
  <section id="list"><p class="empty">Пока пусто. Отправь вес боту в Telegram.</p></section>
</main>

<script>
const $ = s => document.querySelector(s);
const f1 = n => n.toFixed(1).replace('.', ',');
const sign = n => (n > 0 ? '+' : n < 0 ? '−' : '') + f1(Math.abs(n));
const calm = matchMedia('(prefers-reduced-motion: reduce)').matches;
let data = [], shown = null;

function countTo(v) {
  if (shown === v) return;
  const a = shown ?? v, t0 = performance.now();
  if (calm || shown === null) { $('#val').textContent = f1(v); shown = v; return; }
  const step = t => {
    const k = Math.min(1, (t - t0) / 700), e = 1 - Math.pow(1 - k, 3);
    $('#val').textContent = f1(a + (v - a) * e);
    if (k < 1) requestAnimationFrame(step); else shown = v;
  };
  requestAnimationFrame(step);
}

function chart() {
  const el = $('#chart'), d = data.slice(-30);
  if (!d.length) { el.innerHTML = ''; return; }
  const W = el.clientWidth, H = 170, T = 10, B = 24;
  const ws = d.map(x => x.w), lo = Math.min(...ws) - .4, hi = Math.max(...ws) + .4;
  const t0 = d[0].t, t1 = d.at(-1).t, sp = t1 - t0;
  const X = t => sp ? (t - t0) / sp * (W - 16) + 8 : W / 2;
  const Y = w => T + (1 - (w - lo) / (hi - lo)) * (H - T - B);
  const P = d.map(x => [X(x.t), Y(x.w)]);
  const line = P.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join('');
  const last = P.at(-1);
  const day = t => new Date(t).toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' });
  el.innerHTML = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">
    <line x1="0" x2="${W}" y1="${H - B}" y2="${H - B}" stroke="currentColor" opacity=".2"/>
    <path d="${line}" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${last[0]}" cy="${last[1]}" r="6" fill="currentColor"/>
    <text x="0" y="${H - 4}" font-size="12" fill="currentColor" opacity=".55">${day(t0)}</text>
    <text x="${W}" y="${H - 4}" font-size="12" text-anchor="end" fill="currentColor" opacity=".55">${sp ? day(t1) : ''}</text>
  </svg>`;
}

function render() {
  if (!data.length) { $('#when').textContent = 'Данных пока нет'; return; }
  const cur = data.at(-1), prev = data.at(-2);
  const dt = new Date(cur.t);
  $('#when').textContent = 'Измерено ' + dt.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long' }) +
    ', ' + dt.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
  countTo(cur.w);

  const dl = $('#delta'); dl.hidden = false;
  if (!prev) dl.textContent = 'Первая запись';
  else if (cur.w === prev.w) dl.textContent = 'Без изменений';
  else dl.textContent = sign(cur.w - prev.w) + ' кг с прошлого раза';

  const ws = data.slice(-30).map(x => x.w);
  $('#min').textContent = f1(Math.min(...ws));
  $('#avg').textContent = f1(ws.reduce((a, b) => a + b, 0) / ws.length);
  $('#max').textContent = f1(Math.max(...ws));

  $('#list').innerHTML = data.slice(-8).map((x, i, arr) => {
    const p = i ? arr[i - 1] : data[data.length - arr.length - 1];
    const dd = new Date(x.t).toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' });
    return `<div class="row"><span class="d">${dd}</span><span class="c">${p ? sign(x.w - p.w) : ''}</span><span class="w">${f1(x.w)}</span></div>`;
  }).reverse().join('');
  chart();
}

async function load() {
  try {
    const r = await fetch('/api/weight', { cache: 'no-store' });
    data = await r.json();
    render();
  } catch (e) { /* оставляем последние данные */ }
}

load();
setInterval(load, 60000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });
addEventListener('resize', chart);
</script>
</body>
</html>
